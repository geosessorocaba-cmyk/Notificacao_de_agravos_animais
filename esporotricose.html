<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação de Esporotricose - Sorocaba</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <button type="button" class="theme-toggle-btn" onclick="toggleDarkMode()" aria-label="Alternar Tema">
            <span id="theme-icon">🌙</span>
        </button>

        <div class="header-container">
            <div class="logo-bar">
                <img src="images/logo_prefeitura.png" alt="Prefeitura Municipal de Sorocaba">
                <img src="images/logo_zoonoses.jpg" alt="Seção de Controle de Zoonoses">
            </div>
            <div class="header-title-box">
                <h1>Notificação de Esporotricose (Canina / Felina)</h1>
                <p>Prefeitura Municipal de Sorocaba — Seção de Controle de Zoonoses</p>
            </div>
        </div>
    </header>

    <main>
        <div class="nav-back-container" style="margin-bottom: 20px;">
            <button onclick="window.location.href='index.html'" class="btn-back" style="background: none; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text-primary); font-weight: 600;">← Voltar para a tela inicial</button>
        </div>

        <form id="esporo-form">
            <div class="card">
                <h2>👤 Dados do Tutor / Proprietário</h2>
                <div class="form-group">
                    <label for="tutor_nome">Nome do Tutor *</label>
                    <input type="text" id="tutor_nome" required placeholder="Nome completo do responsável">
                </div>
                <div class="form-group">
                    <label for="tutor_cpf">CPF do Tutor</label>
                    <input type="text" id="tutor_cpf" placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label for="tutor_endereco">Endereço Completo (Rua/Avenida) *</label>
                    <input type="text" id="tutor_endereco" required>
                </div>
                <div class="form-group">
                    <label for="tutor_numero">Número</label>
                    <input type="text" id="tutor_numero">
                </div>
                <div class="form-group">
                    <label for="tutor_complemento">Complemento</label>
                    <input type="text" id="tutor_complemento">
                </div>
                <div class="form-group">
                    <label for="tutor_bairro">Bairro *</label>
                    <input type="text" id="tutor_bairro" required>
                </div>
                <div class="form-group">
                    <label for="tutor_telefone">Telefone de Contato</label>
                    <input type="tel" id="tutor_telefone">
                </div>
            </div>

            <div class="card">
                <h2>🐾 Dados do Animal</h2>
                <div class="form-group">
                    <label for="animal_nome">Nome do Animal *</label>
                    <input type="text" id="animal_nome" required>
                </div>
                <div class="form-group">
                    <label for="animal_especie">Espécie *</label>
                    <select id="animal_especie" required>
                        <option value="FELINA">Felina</option>
                        <option value="CANINA">Canina</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="animal_raca">Raça</label>
                    <input type="text" id="animal_raca" placeholder="Ex: SRD, Siamês...">
                </div>
                <div class="form-group">
                    <label for="animal_idade">Idade</label>
                    <input type="text" id="animal_idade" placeholder="Ex: 2 anos">
                </div>
                <div class="form-group">
                    <label for="animal_sexo">Sexo</label>
                    <select id="animal_sexo">
                        <option value="MACHO">Macho</option>
                        <option value="FÊMEA">Fêmea</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h2>🩺 Dados Clínicos e Epidemiológicos</h2>
                <div class="form-group">
                    <label for="distribuicao_lesoes">Distribuição das Lesões *</label>
                    <select id="distribuicao_lesoes" required>
                        <option value="Única">Única</option>
                        <option value="Múltipla (até 5)">Múltipla (até 5)</option>
                        <option value="Disseminada (acima de 5)">Disseminada (acima de 5)</option>
                        <option value="Sem lesão aparente">Sem lesão aparente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Locais Predominantes das Lesões</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Cabeça"> Cabeça</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Corpo"> Corpo</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Membros anteriores"> Membros anteriores</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Membros posteriores"> Membros posteriores</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Cauda"> Cauda</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="humanos_com_lesoes">Há pessoas na residência com lesões de pele?</label>
                    <select id="humanos_com_lesoes">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                        <option value="Não sei informar">Não sei informar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="outros_animais_com_lesoes">Outros animais na residência com lesões?</label>
                    <select id="outros_animais_com_lesoes">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="coleta_amostra">Coleta de amostra para exame diagnóstico</label>
                    <select id="coleta_amostra">
                        <option value="Não, solicito coleta pela Zoonoses">Não, solicito coleta pela Zoonoses</option>
                        <option value="Sim, por laboratório particular">Sim, por laboratório particular</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tratamento_iniciado">Tratamento específico já foi iniciado?</label>
                    <select id="tratamento_iniciado">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tratamento_detalhes">Se iniciado, qual medicamento e data?</label>
                    <textarea id="tratamento_detalhes" rows="2" placeholder="Ex: Itraconazol 100mg iniciado em 10/07/2026"></textarea>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações Adicionais</label>
                    <textarea id="observacoes" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">Enviar Notificação</button>
            </div>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = 'https://iwohicnazfxtysetelpz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3b2hpY25hemZ4dHlzZXRlbHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDgyNzYsImV4cCI6MjEwMDQ4NDI3Nn0.x8QrBDzCV-qqhkv7zLZYB7FH04NT6CKOcjQOio9TglI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let vetData = null;

        document.addEventListener('DOMContentLoaded', () => {
            const vetSalvo = localStorage.getItem('vetNotificante');
            if (vetSalvo) {
                try {
                    vetData = JSON.parse(vetSalvo);
                } catch (err) {
                    console.error("Erro ao ler dados do veterinário", err);
                }
            }

            if (!vetData || !vetData.nome || !vetData.crmv || !vetData.telefone || !vetData.email) {
                alert("Aviso: Os dados completos do Médico Veterinário não foram encontrados.\nPor favor, preencha-os novamente na tela inicial.");
                window.location.href = 'index.html';
            }
        });

        // ENVIO DO FORMULÁRIO
        document.getElementById('esporo-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Enviando Notificação... Aguarde';

            try {
                // 1. Número da Notificação e Ano Atual
                const anoAtual = new Date().getFullYear();
                let numNotificacao = 'ESP-' + Date.now();
                
                try {
                    const { data: rpcNum, error: rpcErr } = await supabaseClient.rpc('gerar_numero_notificacao', { p_agravo: 'esporotricose' });
                    if (!rpcErr && rpcNum) numNotificacao = rpcNum;
                } catch (e) {
                    console.warn("RPC não encontrada ou falhou, usando número local:", numNotificacao);
                }

                // 2. Tabela Principal 'notificacoes'
                const dadosNotificacaoGeral = {
                    numero_notificacao: numNotificacao,
                    agravo: 'esporotricose',
                    ano: anoAtual, // Adicionado pois é NOT NULL no banco
                    vet_nome: vetData?.nome || 'Não informado',
                    vet_crmv: vetData?.crmv || 'Não informado',
                    vet_clinica: vetData?.clinica || 'Não informada',
                    vet_endereco: vetData?.endereco || 'Não informado',
                    vet_telefone: vetData?.telefone || 'Não informado',
                    vet_email: vetData?.email || 'Não informado',
                    tutor_nome: document.getElementById('tutor_nome').value || '',
                    tutor_cpf: document.getElementById('tutor_cpf').value || '',
                    tutor_endereco: document.getElementById('tutor_endereco').value || '',
                    tutor_numero: document.getElementById('tutor_numero').value || '',
                    tutor_complemento: document.getElementById('tutor_complemento').value || '',
                    tutor_bairro: document.getElementById('tutor_bairro').value || '',
                    tutor_telefone: document.getElementById('tutor_telefone').value || '',
                    animal_nome: document.getElementById('animal_nome').value || '',
                    animal_especie: document.getElementById('animal_especie').value || '',
                    animal_raca: document.getElementById('animal_raca').value || '',
                    animal_idade: document.getElementById('animal_idade').value || '',
                    animal_sexo: document.getElementById('animal_sexo').value || ''
                };

                const { data: notifSalva, error: errNotif } = await supabaseClient
                    .from('notificacoes')
                    .insert([dadosNotificacaoGeral])
                    .select()
                    .single();

                if (errNotif) throw new Error("Falha ao salvar Notificação Geral: " + errNotif.message);

                if (!notifSalva || !notifSalva.id) {
                    throw new Error("A notificação foi inserida, mas o banco de dados não retornou o ID gerado.");
                }

                // 3. Captura dos Checkboxes (Mantido como Array nativo)
                const locaisArray = Array.from(document.querySelectorAll('input[name="locais"]:checked'))
                    .map(checkbox => checkbox.value);

                // 4. Tabela específica 'notificacao_esporotricose'
                const dadosEspecificosEsporo = {
                    notificacao_id: notifSalva.id,
                    distribuicao_lesoes: document.getElementById('distribuicao_lesoes').value || '',
                    locais_lesoes: locaisArray, // Enviado como array para a coluna _text
                    humanos_com_lesoes: document.getElementById('humanos_com_lesoes').value || '',
                    outros_animais_com_lesoes: document.getElementById('outros_animais_com_lesoes').value || '',
                    coleta_amostra: document.getElementById('coleta_amostra').value || '',
                    tratamento_iniciado: document.getElementById('tratamento_iniciado').value || '',
                    tratamento_detalhes: document.getElementById('tratamento_detalhes').value || '',
                    observacoes: document.getElementById('observacoes').value || ''
                };

                // Inserção direta sem bloco de fallback para garantir transparência de erros
                const { error: errEsporo } = await supabaseClient
                    .from('notificacao_esporotricose')
                    .insert([dadosEspecificosEsporo]);
                
                if (errEsporo) {
                    throw new Error("Falha ao salvar dados Clínicos: " + errEsporo.message);
                }

                alert(`✅ Notificação registrada com sucesso!\nNúmero do Registro: ${numNotificacao}`);

                if (confirm("Deseja realizar uma nova notificação?")) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('esporo-form').reset();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

            } catch (error) {
                console.error("Erro completo no processo:", error);
                alert("❌ Ocorreu um problema ao enviar:\n" + error.message + "\n\n(Verifique o Console (F12) para mais detalhes)");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Enviar Notificação';
            }
        });
    </script>
</body>
</html>
