<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação de Esporotricose - Sorocaba</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <button type="button" class="theme-toggle-btn" onclick="toggleDarkMode()" aria-label="Alternar Tema">
            <span id="theme-icon">🌙</span>
        </button>

        <div class="header-container">
            <div class="logo-bar">
                <img src="images/logo_prefeitura.png" alt="Prefeitura Municipal de Sorocaba">
                <img src="images/logo_zoonoses.jpg" alt="Seção de Controle de Zoonoses">
            </div>
            <div class="header-title-box">
                <h1>Notificação de Esporotricose (Canina / Felina)</h1>
                <p>Prefeitura Municipal de Sorocaba — Seção de Controle de Zoonoses</p>
            </div>
        </div>
    </header>

    <main>
        <form id="esporo-form">
            <div class="card">
                <h2>👤 Dados do Tutor / Proprietário</h2>
                <div class="form-group"><label>Nome do Tutor *</label><input type="text" id="tutor_nome" required placeholder="Nome completo do responsável"></div>
                <div class="form-group"><label>CPF do Tutor</label><input type="text" id="tutor_cpf" placeholder="000.000.000-00"></div>
                <div class="form-group"><label>Endereço Completo (Rua/Avenida) *</label><input type="text" id="tutor_endereco" required></div>
                <div class="form-group"><label>Número</label><input type="text" id="tutor_numero"></div>
                <div class="form-group"><label>Complemento</label><input type="text" id="tutor_complemento"></div>
                <div class="form-group"><label>Bairro *</label><input type="text" id="tutor_bairro" required></div>
                <div class="form-group"><label>Telefone de Contato</label><input type="tel" id="tutor_telefone"></div>
            </div>

            <div class="card">
                <h2>🐾 Dados do Animal</h2>
                <div class="form-group"><label>Nome do Animal *</label><input type="text" id="animal_nome" required></div>
                <div class="form-group">
                    <label>Espécie *</label>
                    <select id="animal_especie" required>
                        <option value="FELINA">Felina</option>
                        <option value="CANINA">Canina</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </div>
                <div class="form-group"><label>Raça</label><input type="text" id="animal_raca" placeholder="Ex: SRD, Siamês..."></div>
                <div class="form-group"><label>Idade</label><input type="text" id="animal_idade" placeholder="Ex: 2 anos"></div>
                <div class="form-group">
                    <label>Sexo</label>
                    <select id="animal_sexo">
                        <option value="MACHO">Macho</option>
                        <option value="FÊMEA">Fêmea</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h2>🩺 Dados Clínicos e Epidemiológicos</h2>
                <div class="form-group">
                    <label>Distribuição das Lesões *</label>
                    <select id="distribuicao_lesoes" required>
                        <option value="Única">Única</option>
                        <option value="Múltipla (até 5)">Múltipla (até 5)</option>
                        <option value="Disseminada (acima de 5)">Disseminada (acima de 5)</option>
                        <option value="Sem lesão aparente">Sem lesão aparente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Locais Predominantes das Lesões</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Cabeça"> Cabeça</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Corpo"> Corpo</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Membros anteriores"> Membros anteriores</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Membros posteriores"> Membros posteriores</label>
                        <label class="checkbox-item"><input type="checkbox" name="locais" value="Cauda"> Cauda</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Há pessoas na residência com lesões de pele?</label>
                    <select id="humanos_com_lesoes">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                        <option value="Não sei informar">Não sei informar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Outros animais na residência com lesões?</label>
                    <select id="outros_animais_com_lesoes">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Coleta de amostra para exame diagnóstico</label>
                    <select id="coleta_amostra">
                        <option value="Não, solicito coleta pela Zoonoses">Não, solicito coleta pela Zoonoses</option>
                        <option value="Sim, por laboratório particular">Sim, por laboratório particular</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tratamento específico já foi iniciado?</label>
                    <select id="tratamento_iniciado">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Se iniciado, qual medicamento e data?</label>
                    <textarea id="tratamento_detalhes" rows="2" placeholder="Ex: Itraconazol 100mg iniciado em 10/07/2026"></textarea>
                </div>

                <div class="form-group">
                    <label>Observações Adicionais</label>
                    <textarea id="observacoes" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">Enviar Notificação</button>
            </div>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        const SUPABASE_URL = 'SUA_URL_AQUI';
        const SUPABASE_KEY = 'SUA_KEY_AQUI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('esporo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const vet = JSON.parse(localStorage.getItem('vetData_sorocaba')) || {};

            if (!vet.nome || !vet.crmv || !vet.telefone || !vet.email) {
                alert("Identificamos que os dados do Médico Veterinário estão incompletos. Você será redirecionado para a página inicial.");
                window.location.href = 'index.html';
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Enviando...';

            try {
                const { data: numNotificacao, error: errNum } = await _supabase.rpc('gerar_numero_notificacao', { p_agravo: 'esporotricose' });
                if (errNum) throw new Error("Erro ao gerar número: " + errNum.message);

                const { data: notif, error: errNotif } = await _supabase.from('notificacoes').insert([{
                    numero_notificacao: numNotificacao,
                    agravo: 'esporotricose',
                    vet_nome: vet.nome, vet_crmv: vet.crmv, vet_clinica: vet.clinica || 'Não informada',
                    vet_endereco: vet.endereco || 'Não informado', vet_telefone: vet.telefone, vet_email: vet.email,
                    tutor_nome: document.getElementById('tutor_nome').value,
                    tutor_cpf: document.getElementById('tutor_cpf').value || null,
                    tutor_endereco: document.getElementById('tutor_endereco').value,
                    tutor_numero: document.getElementById('tutor_numero').value || null,
                    tutor_complemento: document.getElementById('tutor_complemento').value || null,
                    tutor_bairro: document.getElementById('tutor_bairro').value,
                    tutor_telefone: document.getElementById('tutor_telefone').value || null,
                    animal_nome: document.getElementById('animal_nome').value,
                    animal_especie: document.getElementById('animal_especie').value,
                    animal_raca: document.getElementById('animal_raca').value || null,
                    animal_idade: document.getElementById('animal_idade').value || null,
                    animal_sexo: document.getElementById('animal_sexo').value
                }]).select().single();

                if (errNotif) throw new Error("Erro na tabela principal: " + errNotif.message);

                const locais = Array.from(document.querySelectorAll('input[name="locais"]:checked')).map(c => c.value);

                const { error: errEsporo } = await _supabase.from('notificacao_esporotricose').insert([{
                    notificacao_id: notif.id,
                    distribuicao_lesoes: document.getElementById('distribuicao_lesoes').value,
                    locais_lesoes: locais,
                    humanos_com_lesoes: document.getElementById('humanos_com_lesoes').value,
                    outros_animais_com_lesoes: document.getElementById('outros_animais_com_lesoes').value,
                    coleta_amostra: document.getElementById('coleta_amostra').value,
                    tratamento_iniciado: document.getElementById('tratamento_iniciado').value,
                    tratamento_detalhes: document.getElementById('tratamento_detalhes').value || null,
                    observacoes: document.getElementById('observacoes').value || null
                }]);

                if (errEsporo) throw new Error("Erro nos dados de esporotricose: " + errEsporo.message);

                alert(`Notificação número ${numNotificacao} registrada com sucesso!`);

                if (confirm("Deseja realizar uma nova notificação?")) {
                    window.location.href = 'index.html';
                } else {
                    window.location.reload();
                }

            } catch (err) {
                console.error(err);
                alert("Falha no envio:\n" + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Enviar Notificação';
            }
        });
    </script>
</body>
</html>
