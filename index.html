<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação de Agravos Animais - Sorocaba</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Notificação de Agravos em Saúde Pública</h1>
        <p>Prefeitura Municipal de Sorocaba / Zoonoses</p>
    </header>

    <main>
        <h2>Identificação do Médico Veterinário Notificante</h2>
        <p style="font-size:0.9rem; color:#666; margin-bottom:15px;">Seus dados ficarão armazenados neste navegador para agilizar novos preenchimentos.</p>

        <form id="vet-info-form">
            <div class="form-group">
                <label for="vet_nome">Nome Completo *</label>
                <input type="text" id="vet_nome" required>
            </div>
            <div class="form-group">
                <label for="vet_crmv">CRMV-SP *</label>
                <input type="text" id="vet_crmv" required>
            </div>
            <div class="form-group">
                <label for="vet_clinica">Nome da Clínica / Consultório / Hospital</label>
                <input type="text" id="vet_clinica">
            </div>
            <div class="form-group">
                <label for="vet_endereco">Endereço da Clínica/Consultório</label>
                <input type="text" id="vet_endereco">
            </div>
            <div class="form-group">
                <label for="vet_telefone">Telefone *</label>
                <input type="tel" id="vet_telefone" required>
            </div>
            <div class="form-group">
                <label for="vet_email">E-mail *</label>
                <input type="email" id="vet_email" required>
            </div>

            <h2>Selecione o Agravo para Notificação:</h2>
            <div class="buttons-grid">
                <button type="button" class="btn-agravo" onclick="irParaAgravo('esporotricose.html')">Esporotricose</button>
                <button type="button" class="btn-agravo" onclick="irParaAgravo('leishmaniose.html')">Leishmaniose Visceral</button>
                <button type="button" class="btn-agravo" onclick="irParaAgravo('leptospirose.html')">Leptospirose</button>
                <button type="button" class="btn-agravo" onclick="irParaAgravo('raiva.html')">Raiva</button>
            </div>
        </form>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
