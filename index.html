<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Notificação de Agravos em Saúde Pública (Animais) - Prefeitura Municipal de Sorocaba / UVZ">
    <title>Notificação de Agravos em Saúde Pública - Sorocaba</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-bar">
                <img src="img/logo-prefeitura.png" alt="Prefeitura Municipal de Sorocaba" id="logoPrefeitura">

                <div class="theme-toggle-container">
                    <button type="button" class="theme-toggle-btn" aria-label="Alternar Tema Claro/Escuro" title="Alternar Modo Claro/Escuro">
                        🌙
                    </button>
                </div>

                <img src="img/logo-zoonoses.jpg" alt="Seção de Controle de Zoonoses - Sorocaba" id="logoZoonoses">
            </div>

            <div class="header-title-box">
                <h1>Notificação de Agravos em Saúde Pública</h1>
                <p>Prefeitura Municipal de Sorocaba — Seção de Controle de Zoonoses</p>
            </div>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>👨‍⚕️ Identificação do Médico Veterinário Notificante</h2>
            <div class="card-instruction">
                Seus dados serão gravados com segurança neste dispositivo para agilizar futuras notificações.
            </div>

            <form id="vet-info-form">
                <div class="form-group">
                    <label for="vet_nome">Nome Completo do Médico Veterinário <span class="required">*</span></label>
                    <input type="text" id="vet_nome" required placeholder="Ex: Dra. Ana Caroliny Albuquerque Lins">
                </div>

                <div class="form-group">
                    <label for="vet_crmv">CRMV-SP <span class="required">*</span></label>
                    <input type="text" id="vet_crmv" required placeholder="Ex: 64954">
                </div>

                <div class="form-group">
                    <label for="vet_clinica">Nome da Clínica / Consultório / Hospital Veterinário</label>
                    <input type="text" id="vet_clinica" placeholder="Ex: Hospital Veterinário Cão Mayke">
                </div>

                <div class="form-group">
                    <label for="vet_endereco">Endereço do Estabelecimento Veterinário</label>
                    <input type="text" id="vet_endereco" placeholder="Ex: Av. Betsaida, 25 - Jd. Betânia">
                </div>

                <div class="form-group">
                    <label for="vet_telefone">Telefone de Contato com DDD <span class="required">*</span></label>
                    <input type="tel" id="vet_telefone" required placeholder="Ex: (15) 99876-5432">
                </div>

                <div class="form-group">
                    <label for="vet_email">E-mail Corporativo / Profissional <span class="required">*</span></label>
                    <input type="email" id="vet_email" required placeholder="Ex: veterinario@email.com">
                </div>

                <h2 style="margin-top: 30px;">🐾 Selecione o Agravo para Notificação:</h2>
                
                <div class="agravos-grid">
                    <button type="button" class="btn-agravo" onclick="irParaAgravo('esporotricose.html')">
                        <span>Esporotricose</span>
                        <span class="btn-agravo-arrow" aria-hidden="true">&rarr;</span>
                    </button>

                    <button type="button" class="btn-agravo" onclick="irParaAgravo('leishmaniose.html')">
                        <span>Leishmaniose Visceral</span>
                        <span class="btn-agravo-arrow" aria-hidden="true">&rarr;</span>
                    </button>

                    <button type="button" class="btn-agravo" onclick="irParaAgravo('leptospirose.html')">
                        <span>Leptospirose</span>
                        <span class="btn-agravo-arrow" aria-hidden="true">&rarr;</span>
                    </button>

                    <button type="button" class="btn-agravo" onclick="irParaAgravo('raiva.html')">
                        <span>Raiva / Contactante de Morcego</span>
                        <span class="btn-agravo-arrow" aria-hidden="true">&rarr;</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
